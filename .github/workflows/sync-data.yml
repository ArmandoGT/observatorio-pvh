name: Atualizar base de dados

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observatorio-pvh-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Verificar configuração da coleta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
        run: |
          for name in DATABASE_URL DATABASE_SSL_CA; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret obrigatório ausente: $name"
              exit 1
            fi
          done
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Coletar obras e persistir histórico
        run: npm run sync
        env:
          DATABASE_PROVIDER: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
          PMPV_API_TOKEN: ${{ secrets.PMPV_API_TOKEN }}
      - name: Coletar contratos municipais e persistir histórico
        run: npm run sync:contracts
        env:
          DATABASE_PROVIDER: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
          PMPV_API_TOKEN: ${{ secrets.PMPV_API_TOKEN }}
      - name: Coletar receitas e previsão orçamentária
        run: npm run sync:revenues
        env:
          DATABASE_PROVIDER: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
          PMPV_API_TOKEN: ${{ secrets.PMPV_API_TOKEN }}
