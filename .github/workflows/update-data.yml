name: Atualizar dados e publicar observatório

on:
  push:
    branches: [main]
  schedule:
    # 10:17 UTC = 06:17 em America/Cuiaba e Porto Velho (UTC-4).
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observatorio-pvh-production
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Verificar configuração
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for name in SUPABASE_URL SUPABASE_SECRET_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret obrigatório ausente: $name"
              exit 1
            fi
          done
      - run: npm ci
      - name: Coletar obras e persistir histórico
        run: npm run sync
        env:
          SUPABASE_REQUIRED: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PMPV_API_TOKEN: ${{ secrets.PMPV_API_TOKEN }}
      - name: Coletar contratos municipais e persistir histórico
        run: npm run sync:contracts
        env:
          SUPABASE_REQUIRED: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PMPV_API_TOKEN: ${{ secrets.PMPV_API_TOKEN }}
      - name: Coletar receitas e previsão orçamentária
        run: npm run sync:revenues
        env:
          SUPABASE_REQUIRED: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PMPV_API_TOKEN: ${{ secrets.PMPV_API_TOKEN }}
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:cloudflare
        if: github.event_name != 'schedule'
      - run: npm run deploy:check
        if: github.event_name != 'schedule'
      - name: Configurar credenciais de leitura no servidor
        if: github.event_name != 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module -e 'process.stdout.write(JSON.stringify({SUPABASE_URL:process.env.SUPABASE_URL,SUPABASE_SECRET_KEY:process.env.SUPABASE_SECRET_KEY}))' | npx wrangler secret bulk
      - name: Publicar na Cloudflare
        if: github.event_name != 'schedule'
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
